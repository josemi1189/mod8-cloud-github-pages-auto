name: CD Github Pages
on:
  push:
    branches: main

jobs:
  deploy-github-auto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Instalar y configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Use SSH Key
        run: |
          mkdir -p ~/.ssh   
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          sudo chmod 600 ~/.ssh/id_rsa

      - name: Git config
        run: |
          git config --global user.email "jose1189@gmail.com"
          git config --global user.name "José Miguel"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.SSH_PRIVATE_KEY }}
          publish_dir: ./dir
